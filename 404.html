<!DOCTYPE html>
<html>

<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>Page not found</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Page not found">
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    main.error {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      align-items: center;
    }

    main.error .error-number {
      width: 100%;
    }

    main.error .error-number text {
      font-family: monospace;
    }
  </style>
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main class="error">
    <div class="section">
      <svg viewBox="1 0 38 18" class="error-number">
        <text x="0" y="17">404</text>
      </svg>
      <h2 class="error-message">Page Not Found</h2>
      <p class="button-container">
        <a href="/" class="button secondary error-button-home">Go home</a>
      </p>
    </div>
  </main>
  <footer></footer>
  <script nonce="aem" type="module">
    const main = document.querySelector('main');

    try {
      const response = await fetch('/404.plain.html');
      if (!response.ok) throw new Error(`Unable to load authored 404 content: ${response.status}`);

      const template = document.createElement('template');
      template.innerHTML = await response.text();
      main.replaceChildren(template.content);
      main.classList.remove('error');
    } catch (error) {
      // Keep the static fallback below if the authored page is unavailable.
      console.warn(error);
    }

    await import('/scripts/scripts.js');
    const { sampleRUM } = await import('/scripts/aem.js');
    sampleRUM('404', { source: document.referrer });
  </script>
</body>

</html>
