<!DOCTYPE html>
<html>

<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>Page not found</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Page not found">
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main class="error" aria-live="polite">
    <div>
      <h1>Page not found</h1>
      <p><a href="/">Return home</a></p>
    </div>
  </main>
  <footer></footer>
  <script nonce="aem" type="module">
    const main = document.querySelector('main');

    // Client-side fallback for redirects.json (production edge applies these as real
    // 301s; the local dev server does not, and some legacy paths only exist as
    // redirect sources). If the current path matches a redirect Source, honor it.
    try {
      const { pathname, search, hash } = window.location;
      const res = await fetch('/redirects.json');
      if (res.ok) {
        const { data = [] } = await res.json();
        const norm = (p) => (p.length > 1 ? p.replace(/\/$/, '') : p);
        const here = norm(pathname);
        const match = data.find((row) => norm(row.Source || '') === here);
        if (match && match.Destination && norm(match.Destination) !== here) {
          window.location.replace(match.Destination + search + hash);
          throw new Error('redirecting');
        }
      }
    } catch (redirectError) {
      if (redirectError.message === 'redirecting') {
        // Stop rendering the 404 page; the browser is navigating away.
        throw redirectError;
      }
      // Non-fatal: fall through to normal 404 rendering.
    }

    try {
      const response = await fetch('/404.plain.html');
      if (!response.ok) throw new Error(`Unable to load authored 404 content: ${response.status}`);

      const template = document.createElement('template');
      template.innerHTML = await response.text();
      main.replaceChildren(template.content);
      main.classList.remove('error');
    } catch (error) {
      // Keep the static fallback below if the authored page is unavailable.
      console.warn(error);
    }

    await import('/scripts/scripts.js');
    const { sampleRUM } = await import('/scripts/aem.js');
    sampleRUM('404', { source: document.referrer });
  </script>
</body>

</html>
